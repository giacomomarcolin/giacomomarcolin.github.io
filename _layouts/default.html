<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="google-site-verification" content="dpab_1469YOdSlx34R7vNOgaEhBIToGEpM5FyvEJEEk">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% if page.url == '/' %}
    <link rel="canonical" href="https://giacomomarcolin.github.io/">
    {% else %}
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    {% endif %}
    <title>{% if page.title %}{{ page.title | escape }} &middot; {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <main class="site-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <small>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</small>
      </div>
    </footer>
  </body>
</html>
