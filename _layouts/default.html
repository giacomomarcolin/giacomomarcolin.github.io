<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="google-site-verification" content="dpab_1469YOdSlx34R7vNOgaEhBIToGEpM5FyvEJEEk">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} &middot; {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>

        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} aria-current="page"{% endif %}>Research</a>
          <a href="{{ '/files/cv/giacomo-marcolin-cv.pdf' | relative_url }}">CV</a>
        </nav>
      </div>
    </header>

    <main class="site-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <small>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</small>
      </div>
    </footer>
  </body>
</html>
