- category: work-in-progress
  title: "Gig Work as Income Insurance during Unemployment: Evidence from Germany"
  title_url: "https://doi.org/10.2139/ssrn.4085808"
  coauthors:
    - name: "Valentin Kecht"
      url: "https://www.valentinkecht.com/home"
  abstract: >-
    Despite the rapid growth of the gig economy, there is limited evidence on
    its impact on the labor force. This paper shows that gig work can act as a
    source of a supplementary income during job transitions. Matching a large
    sample of administrative employment data with information on platform
    entry, we demonstrate that individuals tend to take up gig work following a
    job separation when the opportunity arises. The effects on labor markets
    are persistent and vary across socioeconomic dimensions, while for the
    individual workers gig work is only a transitory occupation. Our
    identification relies on a difference-in-differences strategy, exploiting
    the staggered entry of gig platforms across German districts. We find some
    evidence of substitution with other forms of employment, but detect no
    reduction in receipt of unemployment benefits, suggesting that gig work
    does not replace traditional unemployment insurance schemes. However, we
    observe increased job-seeking activity and participation in active labor
    market policies in response to platform availability. Our results partly
    contrast existing evidence, highlighting the role of contextual factors in
    designing adequate labor market policies.
  links: []

